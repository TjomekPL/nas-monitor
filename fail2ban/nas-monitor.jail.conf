# fail2ban jail for nas-monitor. Installed by install.sh to
# /etc/fail2ban/jail.d/nas-monitor.conf - kept in its own file (not
# appended to jail.local) so it never collides with anything else you
# manage there yourself.
#
# maxretry/findtime are intentionally a bit looser than the app's own
# per-username lockout (auth.py: 5 attempts / 5 min lockout) - that one
# already handles a single username being hammered; this jail exists
# for the case it doesn't cover (many different usernames from one
# source) and bans the IP itself once it's clearly not you.
#
# If you ever get banned yourself (e.g. a run of mistyped passwords),
# unban from the box directly:
#   sudo fail2ban-client set nas-monitor unbanip <your-ip>

[nas-monitor]
enabled = true
port = http,https
filter = nas-monitor
logpath = /var/log/nas-monitor/auth.log
maxretry = 8
findtime = 600
bantime = 3600
