# fail2ban filter for nas-monitor's own failed-login log
# (/var/log/nas-monitor/auth.log, written by nas_monitor.auth - see its
# module docstring). Installed by install.sh to
# /etc/fail2ban/filter.d/nas-monitor.conf
#
# This is a second, independent layer on top of the app's own built-in
# per-username lockout (auth.py: MAX_LOGIN_ATTEMPTS/is_locked_out) - that
# one stops password-guessing against a known username; this one bans
# the source IP outright, which also covers someone trying many
# different usernames rather than repeating one.

[Definition]
failregex = ^\S+ \S+ Failed login attempt for user '.*' from <HOST>\s*$
ignoreregex =
