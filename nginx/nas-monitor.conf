# nas-monitor - nginx reverse proxy (TLS termination)
# ---------------------------------------------------
# Installed by install.sh to /etc/nginx/sites-available/nas-monitor and
# symlinked into sites-enabled. gunicorn itself binds to 127.0.0.1:8420
# only (see nas-monitor.service) - this is the only thing actually
# reachable from the LAN. Port 80 exists purely to redirect to 443;
# nothing is ever served over plain HTTP.
#
# __CERT_PATH__ / __KEY_PATH__ are substituted by install.sh with the
# self-signed certificate's actual paths.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate __CERT_PATH__;
    ssl_certificate_key __KEY_PATH__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # gunicorn's own access log already exists per-worker; this keeps a
    # single, real-client-IP log at the point requests actually enter
    # the system. (fail2ban's nas-monitor jail watches a separate,
    # dedicated file - /var/log/nas-monitor/auth.log, written directly
    # by nas_monitor.auth on failed logins - not this one; this is just
    # nginx's normal access/error log, useful on its own for anything
    # else you'd want to check here.)
    access_log /var/log/nginx/nas-monitor-access.log;
    error_log /var/log/nginx/nas-monitor-error.log;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nas_monitor.app trusts this via werkzeug's ProxyFix (see
        # app.py) - without it, every request would look like it came
        # from 127.0.0.1, and both the failed-login log (used by
        # fail2ban) and the operations log would show the proxy's
        # address instead of the real client for every entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # nginx's own default (60s) is shorter than some operations this
        # app can legitimately run - disk_mutate.format_disk's mkfs step
        # alone is given up to 180s, and that's on fast storage; a USB
        # drive can take noticeably longer. Without this, nginx gives up
        # and returns its own HTML error page well before the backend
        # actually finishes - which the frontend then fails to parse as
        # JSON ("Unexpected token '<'") even though the operation itself
        # completes fine in the background. Set comfortably longer than
        # every backend timeout in this app so nginx never preempts a
        # response the backend was already about to send.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
