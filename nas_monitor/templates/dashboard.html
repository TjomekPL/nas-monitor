<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAS monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div>
      <h1>NAS monitor</h1>
      <p class="subtitle">Tylko odczyt &mdash; stan dysków i macierzy RAID</p>
    </div>
    <div class="refresh-info">
      <span id="last-updated">&ndash;</span>
      <span class="dot" id="conn-dot" title="Status połączenia"></span>
    </div>
  </header>

  <main>
    <section>
      <h2>Macierze RAID</h2>
      <div id="raid-container" class="cards"></div>
    </section>

    <section>
      <h2>Dyski</h2>
      <div id="disks-container" class="cards"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>Użytkownicy</h2>
        <button id="add-user-btn" class="btn-primary" type="button">+ Dodaj użytkownika</button>
      </div>
      <div id="users-container" class="user-table"></div>
    <section>
      <div class="section-head">
        <h2>Udziały</h2>
        <button id="add-share-btn" class="btn-primary" type="button">+ Dodaj udział</button>
      </div>
      <div id="shares-container" class="user-table"></div>
    </section>
  </main>

  <dialog id="share-dialog">
    <form id="share-form" method="dialog">
      <h3 id="share-dialog-title">Nowy udział</h3>

      <label id="share-name-label">
        <span class="label-text">Nazwa udziału</span>
        <input type="text" id="share-name" pattern="[a-z][a-z0-9_-]{0,31}" required
               placeholder="np. dane" autocomplete="off">
        <span class="field-hint" id="share-path-preview"></span>
      </label>

      <label>
        <span class="label-text">Komentarz (opcjonalnie)</span>
        <input type="text" id="share-comment" autocomplete="off">
      </label>

      <fieldset>
        <legend>Kto ma dostęp</legend>
        <div id="share-users-checklist" class="groups-checklist"></div>
      </fieldset>

      <label class="checkbox-row">
        <input type="checkbox" id="share-read-only">
        Tylko do odczytu
      </label>

      <p class="form-error" id="share-error"></p>

      <div class="dialog-actions">
        <button type="button" id="share-cancel">Anuluj</button>
        <button type="submit" id="share-submit" class="btn-primary">Utwórz</button>
      </div>
    </form>
  </dialog>

  <dialog id="add-user-dialog">
    <form id="add-user-form" method="dialog">
      <h3 id="user-dialog-title">Nowy użytkownik</h3>

      <label id="username-label">
        <span class="label-text">Nazwa użytkownika</span>
        <input type="text" id="new-username" pattern="[A-Za-z_][A-Za-z0-9_-]{0,31}" required
               placeholder="np. Tomek" autocomplete="off">
        <span class="field-hint" id="username-preview"></span>
      </label>

      <label id="password-label">
        <span class="label-text">Hasło SMB</span>
        <input type="password" id="new-password" required autocomplete="new-password">
      </label>

      <fieldset>
        <legend>Grupy</legend>
        <div id="groups-checklist" class="groups-checklist"></div>
        <label class="inline">
          <input type="text" id="new-group-name" placeholder="nowa grupa (opcjonalnie)"
                 pattern="[a-z_][a-z0-9_-]{0,31}" autocomplete="off">
        </label>
      </fieldset>

      <label class="checkbox-row">
        <input type="checkbox" id="new-allow-login">
        Zezwól na logowanie do systemu / SSH (zwykle NIE dla kont udostępniania)
      </label>

      <p class="form-error" id="add-user-error"></p>

      <div class="dialog-actions">
        <button type="button" id="add-user-cancel">Anuluj</button>
        <button type="submit" id="add-user-submit" class="btn-primary">Utwórz</button>
      </div>
    </form>
  </dialog>

  <template id="raid-card-template">
    <article class="card">
      <div class="card-head">
        <span class="badge"></span>
        <span class="name"></span>
        <span class="level"></span>
      </div>
      <dl class="facts">
        <div><dt>Stan</dt><dd class="state"></dd></div>
        <div><dt>Urządzenie</dt><dd class="path mono"></dd></div>
        <div><dt>Dyski</dt><dd class="devices mono"></dd></div>
        <div class="progress-row"><dt>Postęp</dt><dd class="progress"></dd></div>
      </dl>
      <p class="error"></p>
    </article>
  </template>

  <template id="disk-card-template">
    <article class="card">
      <div class="card-head">
        <span class="badge"></span>
        <span class="name mono"></span>
        <span class="model"></span>
      </div>
      <dl class="facts">
        <div><dt>Rozmiar</dt><dd class="size"></dd></div>
        <div><dt>Temperatura</dt><dd class="temp"></dd></div>
        <div><dt>Godziny pracy</dt><dd class="hours"></dd></div>
        <div><dt>Serial</dt><dd class="serial mono"></dd></div>
      </dl>
      <p class="error"></p>
    </article>
  </template>

  <template id="user-row-template">
    <tr>
      <td>
        <div class="display-name"></div>
        <div class="mono username sub"></div>
      </td>
      <td class="login-cell"><span class="pill"></span></td>
      <td class="smb-cell"><span class="pill"></span></td>
      <td class="groups mono"></td>
      <td class="row-actions">
        <button type="button" class="link-btn edit-btn">Edytuj</button>
        <button type="button" class="link-btn smb-remove-btn">tylko SMB</button>
        <button type="button" class="link-btn danger delete-btn">Usuń</button>
      </td>
    </tr>
  </template>

  <template id="share-row-template">
    <tr>
      <td>
        <div class="display-name"></div>
        <div class="mono username sub path"></div>
      </td>
      <td class="comment"></td>
      <td class="mode-cell"><span class="pill"></span></td>
      <td class="share-users mono"></td>
      <td class="row-actions">
        <button type="button" class="link-btn edit-btn">Edytuj</button>
        <button type="button" class="link-btn danger delete-btn">Usuń</button>
      </td>
    </tr>
  </template>

  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
