<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAS monitor</title>
  <link rel="icon" type="image/svg+xml" href="{{ static_url('icons/favicon.svg') }}">
  <link rel="alternate icon" href="{{ static_url('icons/favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ static_url('icons/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <script>
    (function () {
      var saved = localStorage.getItem("nas-monitor-theme");
      // Respect an explicit saved choice either way; with none yet (e.g.
      // a browser that's never opened the dashboard before), default to
      // dark rather than following the OS preference - his call for the
      // login page specifically.
      document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
      var scale = localStorage.getItem("nas-monitor-ui-scale");
      if (scale === "80" || scale === "120") document.documentElement.setAttribute("data-ui-scale", scale);
    })();
  </script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card" id="login-card">
      <div id="login-blade"></div>
      <h1 id="app-title">NAS monitor</h1>
      <form id="login-form">
        <label>
          <span class="label-text" data-i18n="ui.login.usernameLabel">Nazwa użytkownika</span>
          <input type="text" id="login-username" required autocomplete="username" autofocus>
        </label>
        <label>
          <span class="label-text" data-i18n="ui.login.passwordLabel">Hasło</span>
          <input type="password" id="login-password" required autocomplete="current-password">
        </label>
        <p class="form-error" id="login-error"></p>
        <button type="submit" class="btn-primary" id="login-submit" data-i18n="ui.login.submitBtn">Zaloguj</button>
      </form>
    </div>
  </div>

  <script src="{{ static_url('i18n/pl.js') }}"></script>
  <script src="{{ static_url('i18n/en.js') }}"></script>
  <script src="{{ static_url('i18n/index.js') }}"></script>
  <script src="{{ static_url('login.js') }}"></script>
</body>
</html>
