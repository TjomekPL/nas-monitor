<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAS monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    (function () {
      var saved = localStorage.getItem("nas-monitor-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1 id="app-title">NAS monitor</h1>
      <form id="login-form">
        <label>
          <span class="label-text" data-i18n="ui.login.usernameLabel">Nazwa użytkownika</span>
          <input type="text" id="login-username" required autocomplete="username" autofocus>
        </label>
        <label>
          <span class="label-text" data-i18n="ui.login.passwordLabel">Hasło</span>
          <input type="password" id="login-password" required autocomplete="current-password">
        </label>
        <p class="form-error" id="login-error"></p>
        <button type="submit" class="btn-primary" id="login-submit" data-i18n="ui.login.submitBtn">Zaloguj</button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='i18n/pl.js') }}"></script>
  <script src="{{ url_for('static', filename='i18n/en.js') }}"></script>
  <script src="{{ url_for('static', filename='i18n/index.js') }}"></script>
  <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
